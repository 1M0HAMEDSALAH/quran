name: quran_app
description: "A new Flutter project."
publish_to: "none"

version: 1.1.3+5

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  quran: ^1.3.1
  flutter_native_splash: ^2.4.4
  provider: ^6.0.0
  # audioplayers: ^6.1.1
  get_storage: ^2.1.1
  flutter_local_notifications: ^18.0.1
  # flutter_native_timezone: ^2.0.0
  # flutter_timezone: ^4.0.0
  just_audio: ^0.9.44
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  hijri: ^3.0.0
  flutter_svg: ^2.1.0
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1


  intl: 
  # assets_audio_player: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^4.0.0



flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: BahijTheSansArabic
      fonts:
        - asset: assets/fonts/Bahij_TheSansArabic-SemiLight.ttf
    - family: Kitab
      fonts:
        - asset: assets/fonts/alfont_com_SakkalKitab-Regular.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/alfont_com_Lateef-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/alfont_com_Amiri-Regular.ttf
    - family: KFGQPCUthmanicScriptHAFS
      fonts:
        - asset: assets/fonts/KFGQPC Uthmanic Script HAFS Regular.otf

flutter_native_splash:
  color: "#ffffff"
  image: assets/image.png
  android_12:
    image: assets/image.png
  ios: true
  android: true
  web: false